<!DOCTYPE html>
<html lang="en">
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="Personal invitations, beautifully brought together. A local-first, open-source Flutter image editor.">
  <meta name="theme-color" content="#425B4A">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Invita Studio">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="manifest" href="manifest.json">
  <title>Invita Studio — Make it personal</title>
  <style>
    html,body{margin:0;width:100%;height:100%;background:#F5F6F1}
    #loading{position:absolute;inset:0;display:grid;place-content:center;text-align:center;color:#425B4A;font-family:Georgia,serif}
    #loading strong{font-size:44px;font-weight:400;letter-spacing:-2px}
    #loading span{font:10px system-ui,sans-serif;letter-spacing:3px;text-transform:uppercase;margin-top:14px;color:#858A82}
    #loading i{display:block;width:80px;height:2px;margin:28px auto;background:linear-gradient(90deg,transparent,#425B4A,transparent);animation:breathe 1.6s ease-in-out infinite}
    @keyframes breathe{50%{opacity:.25;transform:scaleX(.6)}}
    @media(prefers-reduced-motion:reduce){#loading i{animation:none}}
  </style>
</head>
<body>
  <div id="loading" aria-label="Loading Invita Studio"><strong>invita</strong><span>Something beautiful is beginning.</span><i></i></div>
  <noscript>Invita Studio needs JavaScript to run its Flutter editor.</noscript>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
